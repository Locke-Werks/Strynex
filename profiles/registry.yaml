# ---------------------------------------------------------------------------
# Deliberately not allocated
# ---------------------------------------------------------------------------
withheld:
  - name: Nightwatch
    reason: >-
      Cooperative stationary awareness in lots and garages. Base 10.3 caps
      PerceptionSummary retention at 60 seconds with no exception and 10.5
      prohibits constructing long-term movement traces. No conformant version
      exists. Recorded so the question stays visible, not so it gets built.
      Resolution is an owner decision about the privacy model, not an
      engineering task.

# ---------------------------------------------------------------------------
# Enum code point partitions (EP-0000 section 4)
# ---------------------------------------------------------------------------
enums:
  IntentCode:
    appendix: A.3
    frozen: [0, 11]
    core_reserved: [12, 63]
    profile_allocated: [64, 191]
    profile_block_size: 8
    vendor_private: [192, 254]
    profile_extension_value: 255
    unallocated_blocks: [[136, 191]]

  TelemetryKind:
    appendix: A.6
    frozen: [0, 4]
    core_reserved: [5, 31]
    profile_allocated: [32, 127]
    profile_block_size: 8
    vendor_private: [128, 254]
    profile_extension_value: 255
    unallocated_blocks: [[88, 127]]

  ObjectClassId:
    specification_section: "7.2"
    frozen: [0x00, 0x0A]
    core_reserved: [0x0B, 0x3F]
    profile_allocated: [0x40, 0xBF]
    profile_block_size: 8
    vendor_private: [0xC0, 0xFE]
    vendor_extension_value: 0xFF
    unallocated_blocks: [[0x58, 0xBF]]
    note: >-
      Base 7.2 already reserves 0x0B-0xFE for the O-CPS registry and defines
      0xFF as VENDOR_EXTENSION requiring an OID. That scheme is sub-allocated,
      not replaced.

# ---------------------------------------------------------------------------
# Dependencies on unresolved errata
# ---------------------------------------------------------------------------
depends_on_errata:
  - erratum: E-01
    document: ../docs/errata-v0.2.md
    blocks: "EP-0000 section 7.3 profile declaration for Class A participants"
    reason: >-
      Class A has no field in which to declare supported profiles, because the
      PerceptionSummary vendor-extension field named by 16.1 does not exist.
  - erratum: E-03
    document: ../docs/errata-v0.2.md
    blocks: "profile 0x0006"
    reason: "VRU tracks cannot reach the 11.4 advisory threshold."
