# O-CPS Extension Profile Registry
#
# Source of truth for extension profile identifiers and enum code point
# allocations. Where this file and profiles/README.md disagree, this file wins.
#
# Partitions are normative and are defined in EP-0000 sections 3 and 4.
# Allocations are permanent and are never reused, including after withdrawal.
#
# SPDX-License-Identifier: Apache-2.0
# Copyright (c) 2026 Archon C. Locke, Specter Point Intelligence, LLC

registry_version: 1
base_specification: "O-CPS v0.2 (April 2026)"
framework: "EP-0000"
status: proposed          # proposed | adopted. Adopted at O-CPS v0.3.
maintainer: "editor of record, per O-CPS 18.4"

# ---------------------------------------------------------------------------
# Profile identifier space (EP-0000 section 3)
# ---------------------------------------------------------------------------
profile_id_ranges:
  - range: [0x0000, 0x0000]
    category: reserved
    description: Denotes "no profile". Never allocated.
  - range: [0x0001, 0x00FF]
    category: core
    description: Open profiles, CC BY 4.0, allocated by the registry maintainer.
  - range: [0x0100, 0x0FFF]
    category: registered
    description: Third-party profiles. Allocated on request, no fee, no technical review.
  - range: [0x1000, 0x7FFF]
    category: vendor
    block_size: 256
    description: Privately administered blocks. Holder must record an IANA PEN or OID arc.
  - range: [0x8000, 0xFFFF]
    category: experimental
    description: >-
      Unregistered. MUST NOT be transmitted by a participant holding production
      SCMS or C-ITS credentials. Collision expected and unmanaged.

# ---------------------------------------------------------------------------
# Allocated profiles
# ---------------------------------------------------------------------------
# status: written | allocated | withheld | withdrawn
# Blocks reference the enum allocations further down.

profiles:
  - id: 0x0001
    name: Intersection Assist
    category: core
    status: written
    document: EP-0001-intersection-assist.md
    min_conformance_class: A
    max_asil: C
    intent_block: [88, 95]
    owed_by: "O-CPS 12.3 (deferred to a forthcoming extension profile); roadmap v0.4"

  - id: 0x0002
    name: Merge Negotiation
    category: core
    status: written
    document: EP-0002-merge-negotiation.md
    min_conformance_class: B
    max_asil: C
    intent_block: [64, 71]
    owed_by: "IntentCode MERGE exists in Appendix A.3 with no protocol defined"

  - id: 0x0003
    name: Signal Timing Advisory
    category: core
    status: allocated
    min_conformance_class: A
    max_asil: B
    intent_block: [128, 135]
    notes: >-
      Vehicle side paces approach against SPaT phase; infrastructure side times
      phase against received Intent. Base 12.2.1 names "Greenwave integration"
      inside Slipstream Mode without specifying it.

  - id: 0x0004
    name: Cooperative Positioning
    category: core
    status: allocated
    min_conformance_class: B
    max_asil: B
    intent_block: [112, 119]
    notes: >-
      GNSS-denied operation. Base 13.4 requires a secondary time source for the
      GNSS-denied case and specifies no cooperative positioning. Interacts with
      errata E-04 (no positional accuracy requirement exists).

  - id: 0x0005
    name: Priority Vehicle Authorization
    category: core
    status: allocated
    min_conformance_class: I
    max_asil: C
    intent_block: [72, 79]
    warning: >-
      SECURITY CRITICAL. A priority claim any participant can assert is a
      corridor denial-of-service primitive. Authorization must bind to enrollment
      credentials, and base 10.5 restricts exactly that linkage. Design the
      authorization model before writing the profile.

  - id: 0x0006
    name: Vulnerable Road User Extended
    category: core
    status: allocated
    min_conformance_class: A
    max_asil: B
    class_id_block: [0x40, 0x47]
    blocked_by: ["E-03"]
    warning: >-
      BLOCKED. Base arithmetic caps a Class A VRU beacon track at trust weight
      0.249 against the 11.4 advisory threshold of 0.5, so no conformant receiver
      may act on it. Do not write this profile until E-03 is resolved in the base
      specification.

