syntax = "proto3";

package ocps.v2;

option java_package = "com.strynex.ocps.v2";
option java_multiple_files = true;
option go_package = "github.com/lockewerks/Strynex/schemas/gen/ocpsv2";

import "ocps/v2/common.proto";


enum GroupMode {
  GROUP_MODE_UNKNOWN = 0;
  FORMING            = 1;
  STABLE             = 2;
  HANDOFF            = 3;
  DISSOLVING         = 4;
}

message GroupState {
  OcpsHeader header      = 1;
  bytes      group_id    = 2;  // 16 bytes
  repeated bytes members = 3;  // ordered; each 8 bytes (cert_id)
  bytes      leader      = 4;  // 8 bytes
  GroupMode  mode        = 5;
  float      gap_target_s = 6;       // [spec §8.5] active gap target, seconds
  float      speed_setpoint_mps = 7; // [spec §8.5] speed setpoint, m/s
  uint64     epoch       = 8;
  bytes      signature   = 15;
}
