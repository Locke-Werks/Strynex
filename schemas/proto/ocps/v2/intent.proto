syntax = "proto3";

package ocps.v2;

option java_package = "com.strynex.ocps.v2";
option java_multiple_files = true;
option go_package = "github.com/lockewerks/Strynex/schemas/gen/ocpsv2";

import "ocps/v2/common.proto";


enum IntentCode {
  INTENT_UNKNOWN       = 0;
  STRAIGHT             = 1;
  LANE_CHANGE_LEFT     = 2;
  LANE_CHANGE_RIGHT    = 3;
  TURN_LEFT            = 4;
  TURN_RIGHT           = 5;
  MERGE                = 6;
  EXIT                 = 7;
  STOP                 = 8;
  YIELD                = 9;
  PLATOON_FORM         = 10;
  PLATOON_LEAVE        = 11;
}

message Intent {
  OcpsHeader header         = 1;
  IntentCode code           = 2;
  uint32     prediction_ms  = 3;
  uint32     confidence     = 4;   // 0-255
  bool       driver_committed = 5;
  bytes      group_id       = 6;   // optional, 16 bytes
  bytes      signature      = 15;
}
