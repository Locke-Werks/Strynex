syntax = "proto3";

package ocps.v2;

option java_package = "com.strynex.ocps.v2";
option java_multiple_files = true;
option go_package = "github.com/lockewerks/Strynex/schemas/gen/ocpsv2";

import "ocps/v2/common.proto";


message PerceivedObject {
  uint32 class_id       = 1;  // see §7.2
  uint32 confidence     = 2;  // 0-255, see §7.3
  float  range_m        = 3;  // [spec §8.3] relative position: range from transmitter
  float  bearing_deg    = 4;  // relative to transmitter heading
  Dimensions dims       = 5;  // [spec §8.3] bounding box (length, width, height)
  float  rel_v_long_mps = 6;  // [spec §8.3] velocity relative to transmitter (longitudinal)
  float  rel_v_lat_mps  = 7;  // [spec §8.3] velocity relative to transmitter (lateral)
  uint32 sensor_mask    = 8;  // bit0=radar, bit1=lidar,
                              // bit2=camera, bit3=ultrasonic,
                              // bit4=other
  bytes  vendor_oid     = 9;  // optional; empty unless class_id=0xFF
}

message PerceptionSummary {
  OcpsHeader header     = 1;
  Pose       own_pose   = 2;  // [spec §7.1] WGS-84; deviation is a conformance failure
  Dimensions own_dims   = 3;
  repeated PerceivedObject objects = 4;
  bytes signature       = 15; // ECDSA-P256 over fields 1-4
}
