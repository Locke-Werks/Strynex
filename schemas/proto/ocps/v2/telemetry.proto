syntax = "proto3";

package ocps.v2;

option java_package = "com.strynex.ocps.v2";
option java_multiple_files = true;
option go_package = "github.com/lockewerks/Strynex/schemas/gen/ocpsv2";

import "ocps/v2/common.proto";


enum TelemetryKind {
  TELEMETRY_UNKNOWN     = 0;
  ROAD_SURFACE_FRICTION = 1;
  WEATHER_ESTIMATE      = 2;
  LOCAL_CONGESTION      = 3;
  HAZARD_FLAG           = 4;
}

message Telemetry {
  OcpsHeader    header = 1;
  TelemetryKind kind   = 2;
  bytes         payload = 3;   // kind-specific encoding
  bytes         signature = 15;
}
