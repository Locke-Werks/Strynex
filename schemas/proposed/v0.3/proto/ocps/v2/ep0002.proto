// O-CPS -- EP-0002 Merge Negotiation payload
//
// PROPOSED. NOT NORMATIVE. See ../../../README.md and
// ../../../../../../profiles/EP-0002-merge-negotiation.md.
//
// Carried in ExtensionBlock.payload with profile_id = 0x0002,
// profile_version = 1, inside an Intent message. CRITICAL is never set by this
// profile.
//
// SPDX-License-Identifier: Apache-2.0
// Copyright (c) 2026 Archon C. Locke, Specter Point Intelligence, LLC

syntax = "proto3";

package ocps.v2.ep0002;

option java_package = "com.strynex.ocps.v2.ep0002";
option java_multiple_files = true;
option go_package = "github.com/lockewerks/Strynex/schemas/gen/ocpsv2/ep0002";


enum RefuseReason {
  REFUSE_UNSPECIFIED    = 0;
  REFUSE_NO_ROOM        = 1;  // yielding vehicle is itself boxed in
  REFUSE_UNSAFE         = 2;  // opening the gap would breach its own envelope,
                              // including the 12.1.6 floors if it is in a group
  REFUSE_NOT_AUTHORIZED = 3;  // standing driver authorization is off
  REFUSE_WRONG_PEER     = 4;  // addressed vehicle is not in the target lane
}

message MergeNegotiation {
  // 8 bytes, generated by the merging vehicle, single use. Not an identifier of
  // a vehicle and does not survive the negotiation. MUST NOT be reused.
  bytes  negotiation_id = 1;

  // 8 bytes. The addressed peer's CURRENT pseudonym cert_id, matching the
  // addressing pattern section 12.1.2 uses for PLATOON_FORM.
  //
  // A negotiation MUST be abandoned if this cert_id rotates mid-negotiation.
  // The merging vehicle re-issues against the new cert_id with a fresh
  // negotiation_id. This is a privacy requirement rather than a reliability one: a
  // negotiation that survived rotation would link a pseudonym across an epoch
  // boundary, which section 10.5 prohibits.
  bytes  peer_cert_id = 2;

  // Monotonic within one negotiation_id.
  uint32 epoch = 3;

  // MERGE_REQUEST only. Longitudinal gap sought, centimetres. MUST NOT be less
  // than the gap the merging vehicle's own ACC would require at current closing
  // speed.
  uint32 gap_request_cm = 4;

  // The sender's commitment window for this message, milliseconds. On
  // MERGE_YIELD this is how long the gap will be held and MUST NOT exceed
  // 4000. A vehicle that has promised a gap and is waiting is behaving unlike
  // its neighbours, and past a few seconds it becomes the hazard rather than
  // the mitigation.
  uint32 valid_for_ms = 5;

  // MERGE_REFUSE only.
  RefuseReason refuse_reason = 6;
}
